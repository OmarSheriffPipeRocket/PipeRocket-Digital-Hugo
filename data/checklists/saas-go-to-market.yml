title: "The SaaS Go-to-Market Checklist for 2026"
subtitle: "Everything to launch or relaunch a B2B SaaS product: market and ICP, messaging and pricing, channels, assets, launch execution, and measurement. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Market & ICP"
    items:
      - "Define the Ideal Customer Profile and the buying committee"
      - "Size the market (TAM/SAM/SOM) for the segment you are entering"
      - "Choose your category and positioning against alternatives"
      - "Validate the core problem with real customer conversations"
  - title: "2. Messaging & pricing"
    items:
      - "Write a clear value proposition and message per persona"
      - "Decide pricing and packaging (tiers, PLG vs sales-led, trial vs demo)"
      - "Build the core narrative sales and marketing will both use"
  - title: "3. Channels & motion"
    items:
      - "Choose the primary motion: product-led, sales-led, or hybrid"
      - "Pick the channel mix (SEO, paid, outbound, partnerships, community)"
      - "Plan the demand-generation program for launch and beyond"
  - title: "4. Assets & site"
    items:
      - "Ship the website, key landing pages, and pricing page"
      - "Prepare sales collateral, demo scripts, and objection handling"
      - "Set up docs, onboarding, and support for new users"
  - title: "5. Launch execution"
    items:
      - "Run a pre-launch list: tracking, CRM, routing, and QA"
      - "Coordinate launch-day PR, social, email, and community pushes"
      - "Plan the post-launch nurture and follow-up motion"
  - title: "6. Measure & iterate"
    items:
      - "Track pipeline, CAC, and activation from day one"
      - "Set up attribution so you know which channels drive revenue"
      - "Build a feedback loop from sales and customers into the roadmap"

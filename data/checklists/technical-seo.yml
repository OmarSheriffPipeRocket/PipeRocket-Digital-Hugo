title: "The Technical SEO Checklist for 2026"
subtitle: "Every technical check that decides whether Google (and AI crawlers) can find, render, and trust your site. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Crawlability"
    items:
      - "Confirm robots.txt allows your important pages and blocks only what should be blocked"
      - "Submit a clean XML sitemap in Search Console and fix any read errors"
      - "Do not block CSS or JS that Google needs to render the page"
      - "Find and fix orphan pages that have no internal links pointing to them"
      - "Review crawl stats and server logs for wasted crawl budget on junk URLs"
      - "Decide whether to allow or block AI crawlers (GPTBot, PerplexityBot, ClaudeBot, Google-Extended)"
  - title: "2. Indexing"
    items:
      - "Confirm money pages are indexed (no accidental noindex or canonical to another URL)"
      - "Fix Search Console coverage errors: crawled-not-indexed, discovered-not-indexed, soft 404s"
      - "Set correct canonical tags to consolidate duplicate and parameter URLs"
      - "Noindex thin, staging, and internal-search pages you never want ranking"
      - "Keep one indexable version per page (no http/https or www duplication)"
  - title: "3. Site architecture & internal linking"
    items:
      - "Keep important pages within three clicks of the homepage"
      - "Use a logical URL structure that mirrors your site hierarchy"
      - "Add descriptive internal links from high-authority pages to money pages"
      - "Implement breadcrumb navigation with BreadcrumbList structured data"
      - "Handle pagination and faceted navigation so they do not create crawl traps"
  - title: "4. Page speed & Core Web Vitals"
    items:
      - "Pass Largest Contentful Paint (LCP) under 2.5s on mobile"
      - "Pass Interaction to Next Paint (INP) under 200ms (INP replaced FID)"
      - "Pass Cumulative Layout Shift (CLS) under 0.1"
      - "Compress and correctly size images, and serve next-gen formats (WebP/AVIF)"
      - "Eliminate render-blocking CSS/JS and defer what is not critical"
      - "Enable caching and serve static assets from a CDN"
  - title: "5. Mobile & rendering"
    items:
      - "Confirm the site is mobile-friendly and responsive (Google indexes mobile-first)"
      - "Make sure key content is server-rendered or reliably crawlable, not hidden behind JS"
      - "Check the rendered DOM in Search Console matches what users see"
  - title: "6. Structured data & international"
    items:
      - "Add relevant schema (Article, Product, FAQ, Breadcrumb, Organization) and validate it"
      - "Fix structured-data errors and warnings in the Rich Results Test"
      - "Set hreflang correctly if you serve multiple languages or regions"
  - title: "7. Security & hygiene"
    items:
      - "Serve HTTPS sitewide and fix mixed-content warnings"
      - "Fix 404s, redirect chains, and redirect loops"
      - "Return correct HTTP status codes (200, 301, 404, 410) for each case"
      - "Remove or 301 legacy URLs that still get crawled"
  - title: "8. Monitoring"
    items:
      - "Watch the Search Console coverage and Core Web Vitals reports for regressions"
      - "Set up alerts for uptime, crawl errors, and sudden index drops"
      - "Re-crawl the site on a schedule to catch new technical issues early"

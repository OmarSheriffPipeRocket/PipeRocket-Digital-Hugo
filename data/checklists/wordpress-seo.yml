title: "The WordPress SEO Checklist for 2026"
subtitle: "Everything to configure WordPress for SEO the right way: core settings, an SEO plugin, performance, on-page, technical hygiene, and maintenance. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Core WordPress settings"
    items:
      - "Set permalinks to the post-name structure (Settings > Permalinks)"
      - "Uncheck 'Discourage search engines from indexing' (Settings > Reading)"
      - "Set the site title and tagline meaningfully"
      - "Verify the site in Google Search Console and submit the sitemap"
  - title: "2. Install and configure an SEO plugin"
    items:
      - "Install one SEO plugin (Yoast, Rank Math, or SEOPress) — not several"
      - "Enable the XML sitemap and confirm it is submitted to Search Console"
      - "Configure title and meta description templates per content type"
      - "Set the default social/Open Graph image and defaults"
  - title: "3. Performance & Core Web Vitals"
    items:
      - "Choose a lightweight, well-coded theme"
      - "Add a caching plugin and, where possible, a CDN"
      - "Compress images and serve WebP/AVIF; enable lazy loading"
      - "Audit and remove plugins you do not need (each adds weight)"
      - "Pass Core Web Vitals (LCP, INP, CLS) on mobile"
  - title: "4. On-page (per post/page)"
    items:
      - "Write a unique title tag and meta description via the SEO plugin"
      - "Use one H1 and a logical heading structure"
      - "Add descriptive image alt text"
      - "Add internal links with descriptive anchor text"
      - "Use short, keyword-aware URL slugs (edit the auto-slug)"
  - title: "5. Technical hygiene"
    items:
      - "Control indexing of tag, category, author, and date archives (noindex thin ones)"
      - "Confirm canonical tags are set correctly by the plugin"
      - "Add breadcrumb navigation with schema"
      - "Fix or redirect 404s and broken links"
      - "Serve HTTPS sitewide with no mixed content"
  - title: "6. Content & schema"
    items:
      - "Enable Article/FAQ/HowTo schema via the SEO plugin where relevant"
      - "Keep a clean category structure and avoid thin tag pages"
      - "Front-load a quotable answer so AI engines can cite the page"
  - title: "7. Security & maintenance"
    items:
      - "Keep WordPress core, theme, and plugins updated"
      - "Run automated backups"
      - "Block comment spam and monitor for broken links on a schedule"

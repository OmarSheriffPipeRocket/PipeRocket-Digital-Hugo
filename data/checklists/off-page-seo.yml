title: "The Off-Page SEO Checklist for 2026"
subtitle: "Everything beyond your own pages that builds authority and trust: links, brand mentions, reviews, and the signals AI engines now weigh. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Audit your backlink profile"
    items:
      - "Pull your full backlink profile from Search Console plus a third-party tool"
      - "Identify and disavow only genuinely toxic or spammy links (do not over-disavow)"
      - "Map your referring domains against your top competitors to find the gap"
      - "Recover lost links to important pages with outreach or 301s"
  - title: "2. Earn links with assets"
    items:
      - "Publish linkable assets: original research, data studies, free tools, and calculators"
      - "Run digital PR: pitch one data-led story to relevant journalists and publications"
      - "Find unlinked brand mentions and ask for a link"
      - "Do broken-link building: replace competitors' dead links with your resource"
      - "Contribute expert quotes and source requests (HARO-style) for authority links"
      - "Guest post selectively on relevant, real publications (never PBNs or link farms)"
  - title: "3. Build brand & entity signals"
    items:
      - "Earn brand mentions on the third-party sites people and AI models trust"
      - "Keep entity facts (name, founding year, HQ, category) consistent everywhere"
      - "Claim and complete your Google Business Profile and knowledge-panel sources"
      - "Keep NAP and profile details consistent across every citation and directory"
      - "Maintain active, complete profiles on the social platforms your buyers use"
  - title: "4. Win reviews & third-party presence"
    items:
      - "Claim and optimise your G2, Capterra, and Trustpilot profiles"
      - "Earn and respond to reviews to build off-site trust signals"
      - "Get listed in credible best-of roundups and listicles in your category"
      - "Build a genuine presence in relevant communities (Reddit, Quora, Slack groups)"
  - title: "5. Measure off-page impact"
    items:
      - "Track referring-domain growth, not just total backlink count"
      - "Monitor anchor-text distribution so it stays natural"
      - "Watch for newly lost or gained links to your key pages"
      - "Track referral traffic and brand-search lift as authority compounds"

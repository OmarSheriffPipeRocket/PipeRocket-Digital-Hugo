title: "The Local SEO Checklist for 2026"
subtitle: "Everything to rank in local search and the map pack: your Business Profile, citations, reviews, and local signals. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Google Business Profile"
    items:
      - "Claim and verify your Google Business Profile"
      - "Choose the most accurate primary category, then relevant secondary categories"
      - "Complete every field: hours, services, attributes, description, and photos"
      - "Add products/services and keep posts and photos fresh"
  - title: "2. NAP & citations"
    items:
      - "Keep your name, address, and phone number identical everywhere"
      - "Build and clean citations on the major aggregators and industry directories"
      - "Fix duplicate or inconsistent listings"
      - "Embed a Google Map and add LocalBusiness structured data on your site"
  - title: "3. Reviews & reputation"
    items:
      - "Earn a steady stream of Google reviews (never buy fake ones)"
      - "Respond to every review, positive and negative"
      - "Earn reviews on the platforms that matter in your industry"
  - title: "4. On-page local signals"
    items:
      - "Create a dedicated, unique page for each location you serve"
      - "Include city and region terms naturally in titles, headings, and content"
      - "Add local content: area guides, local case studies, and community involvement"
  - title: "5. Local links & authority"
    items:
      - "Earn links from local news, chambers of commerce, and community sites"
      - "Sponsor or partner with local organisations for genuine mentions"
      - "Get listed in reputable local and niche directories"

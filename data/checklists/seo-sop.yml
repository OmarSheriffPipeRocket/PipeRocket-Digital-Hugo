title: "The SEO SOP: One Team Member's 13-Phase Workflow, Onboarding to Reporting"
subtitle: "The step-by-step SOP for one SEO team member, from a client's first day to the weekly report. It is the exact routine we follow at PipeRocket Digital. Tick each point as you finish it (your progress saves automatically) and download the whole SOP as a PDF or Excel."
groups:
  - title: "Phase 1: Onboarding & discovery (Week 1)"
    items:
      - "Join the internal kickoff to agree scope, the one main KPI, and deliverables before contacting the client"
      - "Collect the onboarding sheet: ICP, named competitors, average deal size, target industries, and positioning"
      - "Map the buying committee (economic buyer, daily user, blocker) so keywords map to real personas"
      - "Sit through a demo or run the trial to learn the core jobs-to-be-done and customer language"
      - "List every current acquisition channel and note what has driven pipeline and what has stalled"
      - "Confirm one north-star KPI in writing (demos, trials, or pipeline) plus its current monthly baseline"
      - "Set the expectation that month 1 is diagnosis and setup, not ranking movement"
      - "Name every approver and agree the content sign-off chain and review turnaround"
      - "Set up the shared Slack channel, PM board, and weekly comms cadence"
  - title: "Phase 2: Access & tooling setup (Week 1)"
    items:
      - "Request domain-level Search Console access (sc-domain, not a single URL-prefix)"
      - "Confirm analyst-level GA4 access and verify demo and trial events are firing"
      - "Get Microsoft Clarity access and confirm it captures the pricing, demo, and product pages"
      - "Get CRM access (HubSpot or Salesforce) to map organic sessions to MQLs and revenue"
      - "Confirm Tag Manager publish rights so you can ship tracking without a developer"
      - "Push one trivial CMS edit end to end to learn if changes are self-serve or dev-gated"
      - "Connect Ahrefs or Semrush, load priority keywords into a rank tracker, and license a crawler"
      - "Build a Looker Studio dashboard wired to GSC, GA4, and the CRM for live data"
      - "Store every login in the team password manager with its permission level"
  - title: "Phase 3: Technical audit (Weeks 1-2)"
    items:
      - "Run a public Screaming Frog crawl and PageSpeed on the top 20 URLs while access lands"
      - "Compare GSC submitted-vs-indexed counts and export every not-indexed URL"
      - "Render money-page templates in URL Inspection to confirm content is in server HTML, not JS-only"
      - "Confirm the blog and money pages live on subfolders, within three clicks, no redirect chains"
      - "Check www, HTTPS, and trailing-slash variants 301 to one canonical, and flag thin pages"
      - "Pull mobile Core Web Vitals (LCP, INP, CLS) and list every template failing the thresholds"
      - "Validate Organization, SoftwareApplication, FAQPage, and Breadcrumb schema in the Rich Results Test"
      - "Confirm robots.txt and llms.txt allow GPTBot, OAI-SearchBot, ClaudeBot, and PerplexityBot"
      - "Score every finding by severity and effort into a prioritized fix list with an owner"
  - title: "Phase 4: Measurement & baseline (Weeks 1-2)"
    items:
      - "Submit a real test demo, trial, and contact form and confirm each event lands in GA4 DebugView"
      - "Mark every verified lead event as a key event and confirm a non-zero Realtime count"
      - "Link GA4 to Search Console so organic query and landing-page data flows through"
      - "Confirm the CRM stamps demos with an organic source and turn on offline conversion import"
      - "Build dashboard tiles: organic sessions, key events, MQLs, indexed pages, average position"
      - "Load the rank tracker with the top 20-30 commercial BOFU keywords per target region"
      - "Capture a dated baseline: keyword positions, indexed URLs, 3-month sessions, demos, trials"
      - "Record baseline Core Web Vitals, Domain Rating, and referring-domain count"
      - "Lock the month-0 baseline column so everyone measures against the same snapshot"
  - title: "Phase 5: All-pages report & existing potential (Weeks 2-3)"
    items:
      - "Merge the GSC Pages report and GA4 landing-page report into one master sheet keyed by URL"
      - "Tag every URL with its page category (product, feature, comparison, pricing, blog, glossary, tool)"
      - "Label each URL with funnel intent (TOFU, MOFU, BOFU) based on the query it ranks for"
      - "Assign one primary keyword to each URL with its overall and target-region volume"
      - "Add 6-month traffic and leads month-over-month per URL wherever attribution exists"
      - "Flag striking-distance pages in positions 5-20 and sort by target-region volume"
      - "Flag high-impression, low-CTR pages and note the query to rewrite the title for"
      - "Flag decaying pages down three-plus months and mark each for a content refresh"
      - "Find cannibalization (one query, two-plus URLs) and decide which page should own it"
  - title: "Phase 6: Keyword research & gap analysis (Weeks 2-4)"
    items:
      - "Build the seed list from ICP language in the onboarding sheet and sales-call notes"
      - "Run a competitor gap analysis: export every page-1 keyword rivals rank for and you don't"
      - "Pull category and industry keywords (X software, best X tool, X for [industry])"
      - "Harvest integration and comparison demand (X vs Y, X alternative, X integration)"
      - "Capture emerging terms from Google Trends, autocomplete, and Reddit threads"
      - "Cluster keywords by SERP intent and map each to one funnel stage and page type"
      - "Estimate value per cluster: volume, region volume, modeled CTR, and lead value"
      - "Score winnability by comparing keyword difficulty and competitor DA to client authority"
      - "Deliver the prioritized master keyword map as the new-pages build backlog"
  - title: "Phase 7: Strategy & prioritized roadmap (Weeks 3-4)"
    items:
      - "Merge the existing-potential and keyword-gap lists into one roadmap, tagged optimize or new page"
      - "Score each row by impact over effort and sort the backlog"
      - "Schedule striking-distance quick wins in the first sprint before any new page"
      - "Sequence the new-page lane so BOFU templates ship first for demos by day 30"
      - "Set a monthly publishing velocity matched to real writer and developer bandwidth"
      - "Lay the backlog onto a 90-day calendar naming what ships in 30, 60, and 90 days"
      - "Define one success metric per lane: lead lift for optimize, net-new demos for new pages"
      - "Package the sheet, scoring model, and calendar into a keyword strategy document"
      - "Walk the client through the roadmap and get written sign-off before briefing pages"
  - title: "Phase 8: BOFU money pages first (Ongoing, from week 4)"
    items:
      - "Sequence the BOFU queue by revenue: product, feature, vs, and alternatives pages first"
      - "Write a one-page brief per URL: keyword, volume, intent, top-5 SERP, internal links, and CTA"
      - "On every vs and alternatives page, build a side-by-side table and an honest verdict"
      - "Open product and feature pages with a one-sentence answer, then objections and proof"
      - "Add on-page basics and schema: title, single H1, descriptive URL, Product or FAQPage schema"
      - "Place a stage-matched CTA above the fold and a repeat CTA after the comparison"
      - "Run pre-publish QA: intent match, links resolve, mobile holds, test form writes to the CRM"
      - "Publish, then request indexing manually in GSC via the Chrome extension (never API)"
      - "Log every shipped BOFU URL with page type, keyword, publish date, and 30-day demo target"
  - title: "Phase 9: TOFU & topical authority (Ongoing)"
    items:
      - "Map each BOFU cluster to its supporting TOFU topics (blogs, glossary, guides, tools)"
      - "Build a topical map per cluster and check it against competitor coverage and People Also Ask"
      - "Assign one keyword and intent to every TOFU asset and confirm no page already targets it"
      - "Publish a glossary definition for each core term so engines attach clear entity meaning"
      - "Draft guides under a named author with first-hand experience, cited sources, and original screenshots"
      - "Ship at least one interactive asset per cluster (calculator, checklist, or template)"
      - "Add a contextual link and clear next step from every TOFU asset to its BOFU page"
      - "Set a publish-and-refresh cadence you can sustain and mark a cluster done only when fully covered"
      - "Track assisted conversions and BOFU influence per asset, not just its own sessions"
  - title: "Phase 10: Internal linking, TOFU to BOFU (Ongoing)"
    items:
      - "Build a link map: list every BOFU page as a hub and assign each TOFU asset to one hub"
      - "Add a contextual in-body link from every new TOFU asset to its BOFU page with descriptive anchor"
      - "Crawl for orphan pages and add a link to each orphaned BOFU page from its cluster"
      - "Re-link supporting content so every BOFU page sits within three clicks of the homepage"
      - "Add links from your highest-authority pages into priority new BOFU and TOFU pages"
      - "Vary anchor text across links to the same page instead of repeating one exact match"
      - "Set a minimum inlink count per BOFU page and re-check after every sprint"
      - "Re-link each cluster when a new asset ships: point it up to its hub and a link back down"
      - "Audit internal links quarterly for broken targets, redirect chains, and stray nofollows"
  - title: "Phase 11: Off-page & digital PR (Ongoing)"
    items:
      - "Run a backlink-gap analysis and score each prospect by topical relevance to your ICP"
      - "Map every link prospect to the BOFU or pillar page it should point to"
      - "Publish one original-data study per quarter and pitch the standout stat to journalists"
      - "Pitch three to five guest posts to publications your buyers read, each with one mapped link"
      - "Set up HARO-style sourcing (Connectively, Featured, Qwoted) and submit two to three quotes a week"
      - "Reclaim unlinked brand mentions and email each author for a link to the right page"
      - "Complete your G2, Capterra, and directory profiles with screenshots and a review request"
      - "Log every earned link with domain, authority, target page, anchor, and funnel stage"
  - title: "Phase 12: AEO & GEO, AI search visibility (Ongoing)"
    items:
      - "Allow GPTBot, OAI-SearchBot, ClaudeBot, PerplexityBot, and Google-Extended in robots.txt"
      - "Publish an llms.txt listing your core product, pricing, comparison, and integration URLs"
      - "Lock one canonical set of entity facts and make them identical everywhere (site, Crunchbase, G2, schema)"
      - "Rewrite every BOFU page to open with a 40-60 word quotable answer, plus schema"
      - "Complete your G2 and Capterra profiles and seed honest answers in Reddit and Quora threads"
      - "Pursue a Wikidata record, a Wikipedia entity where notable, and trade-press coverage"
      - "Run a fixed set of 20-30 buyer prompts in ChatGPT, Perplexity, and AI Overviews monthly"
      - "Log share of answer monthly and validate cited pages in the Clarity AI-citation tool, not GSC"
      - "Where a competitor is cited and you are not, upgrade the exact page and re-test next month"
  - title: "Phase 13: Reporting & iteration (Weekly, monthly, quarterly)"
    items:
      - "Build a weekly Looker Studio dashboard of GSC clicks, GA4 sessions, and CRM demos by funnel tier"
      - "Report weekly leads and traffic by funnel intent, not one blended organic number"
      - "Flag the pages that gained or lost the most sessions and write one next action each"
      - "Report five monthly metrics in priority order, starting with organic demos and pipeline"
      - "Pull organic-attributed pipeline from the CRM and reconcile it against GA4 before reporting"
      - "Track ranking movement on the top 20-30 commercial keywords and the vs and pricing pages"
      - "Run the monthly strategy call: walk the metrics, show winners and decayers, lock next 30 days"
      - "Re-prioritise quarterly using performance data and which paid keywords actually convert"
      - "Feed every learning back into the optimize and new-page plans with expected impact"

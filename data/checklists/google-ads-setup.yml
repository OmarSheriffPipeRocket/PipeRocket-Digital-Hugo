title: "The Google Ads Setup Checklist for 2026"
subtitle: "Everything to lock in before a new Google Ads account goes live, from billing and conversion tracking to campaign structure, keywords, ads, and a final pre-launch QA. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF or Excel."
groups:
  - title: "1. Account foundation"
    items:
      - "Set the correct time zone and currency (they cannot be changed later)"
      - "Add billing, set the payment threshold, and confirm no daily-budget surprises"
      - "Link Google Analytics 4, Search Console, and Merchant Center where relevant"
      - "Set account-level user access and turn on 2-step verification"
      - "Enable auto-tagging so GCLID flows into GA4 and your CRM"
  - title: "2. Conversion tracking first"
    items:
      - "Define primary vs secondary conversion actions before building campaigns"
      - "Install and verify the Google Ads tag and enhanced conversions"
      - "Confirm each conversion fires once and reports the right value"
      - "Decide the attribution model (data-driven is the current default)"
      - "Run a real test conversion before any spend goes live"
  - title: "3. Campaign structure"
    items:
      - "Separate Brand, Generic (non-brand), and Competitor into distinct campaigns"
      - "Choose a bid strategy that matches conversion volume (Manual or Max Clicks early, tCPA/tROAS once data exists)"
      - "Set realistic budgets per campaign tied to your CAC targets"
      - "Set location, language, and ad-schedule targeting to match your ICP"
      - "Switch off the Search Partners and Display Network expansion on Search campaigns unless intentional"
  - title: "4. Keywords and targeting"
    items:
      - "Group tightly themed keywords into ad groups (few keywords per group)"
      - "Use a deliberate match-type strategy rather than defaulting to broad"
      - "Build a negative keyword list before launch (jobs, free, cheap, DIY, irrelevant terms)"
      - "Add brand terms as negatives in non-brand campaigns to prevent overlap"
      - "For B2B, exclude obvious consumer and student search intent"
  - title: "5. Ads and assets"
    items:
      - "Write at least 2-3 responsive search ads per ad group with distinct angles"
      - "Pin headlines only where a claim or compliance term must stay fixed"
      - "Add all relevant assets: sitelinks, callouts, structured snippets, lead form or call"
      - "Point each ad group to a message-matched landing page, not the homepage"
      - "Confirm landing pages load fast, work on mobile, and have working forms"
  - title: "6. Pre-launch QA"
    items:
      - "Review the final URL and tracking template on every ad"
      - "Confirm conversion tracking is verified and recording in the account"
      - "Double-check budgets, bids, and locations one last time"
      - "Set a launch date and a first-check date (48-72 hours in) to catch early waste"
      - "Document the account structure so anyone can pick it up"

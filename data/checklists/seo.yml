title: "The Complete SEO Checklist for 2026"
subtitle: "Every step to plan, build, and grow organic search in 2026, from foundations to AI search. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Setup & foundations"
    items:
      - "Verify your site in Google Search Console and Bing Webmaster Tools"
      - "Install GA4 and confirm conversions/key events are tracking"
      - "Submit an XML sitemap and confirm it is read without errors"
      - "Check robots.txt is not blocking anything you want indexed"
      - "Set one preferred domain (https, www vs non-www) and 301 the rest"
      - "Run a baseline crawl (Screaming Frog or similar) to record your starting point"
  - title: "2. Keyword research"
    items:
      - "Define your ICP and the problems they search for before touching a tool"
      - "Build a seed keyword list, then expand it with a keyword tool"
      - "Group keywords by search intent (informational, commercial, transactional, navigational)"
      - "Check the live SERP to confirm the real intent behind each target"
      - "Map keywords to funnel stage (TOFU, MOFU, BOFU) and to a page"
      - "Prioritise by opportunity: volume, difficulty, and business value, not volume alone"
      - "Cluster same-intent keywords into one topic to avoid cannibalization"
  - title: "3. On-page SEO"
    items:
      - "Write a unique, compelling title tag with the primary keyword near the front"
      - "Write a meta description that earns the click (it is your SERP ad copy)"
      - "Use one clear H1 and a logical H2/H3 heading structure"
      - "Match content to search intent and answer the query in the first paragraph"
      - "Add descriptive, keyword-aware image alt text and compress images"
      - "Use short, readable URLs that include the target keyword"
      - "Add internal links to and from relevant pages with descriptive anchor text"
      - "Include a clear next step (CTA) matched to the page's intent"
  - title: "4. Content & E-E-A-T"
    items:
      - "Cover the topic more completely and usefully than the pages currently ranking"
      - "Add first-hand experience AI can't fake: original data, screenshots, examples"
      - "Show a named author with real credentials and a bio"
      - "Cite and link to authoritative sources for every claim or statistic"
      - "Keep content fresh: review and update high-value pages on a schedule"
      - "Prune or consolidate thin, duplicate, or cannibalizing pages"
  - title: "5. Technical SEO"
    items:
      - "Confirm important pages are crawlable and indexable (no accidental noindex)"
      - "Fix 404s, redirect chains, and redirect loops"
      - "Set correct canonical tags to consolidate duplicate URLs"
      - "Pass Core Web Vitals, especially INP and LCP, on mobile"
      - "Ensure the site is mobile-friendly and responsive"
      - "Make sure key content is server-rendered or reliably crawlable (not JS-hidden)"
      - "Add structured data (Article, FAQ, Product, Breadcrumb) where relevant"
      - "Keep a clean, shallow site architecture with a logical internal-link hierarchy"
      - "Serve HTTPS sitewide and fix mixed-content warnings"
  - title: "6. Link building & off-page"
    items:
      - "Audit your current backlink profile and disavow only truly toxic links"
      - "Earn links with genuinely linkable assets (original data, tools, guides)"
      - "Run digital PR: one data-led story beats dozens of low-quality guest posts"
      - "Build relevant brand mentions across trusted third-party sites"
      - "Claim and optimise your key profiles (G2, industry directories, review sites)"
  - title: "7. Local SEO (if you have local intent)"
    items:
      - "Create and fully complete your Google Business Profile"
      - "Keep NAP (name, address, phone) consistent across every citation"
      - "Earn and respond to reviews on Google and relevant platforms"
      - "Add LocalBusiness structured data to your site"
  - title: "8. AI search: AEO & GEO"
    items:
      - "Front-load a clear, quotable answer in the first 1-2 sentences of each page"
      - "Structure content in self-contained Q&A blocks that read well out of context"
      - "Add original stats and definitions that LLMs prefer to cite"
      - "Do not block AI crawlers (GPTBot, PerplexityBot, ClaudeBot, Google-Extended) unless you mean to"
      - "Earn mentions on the third-party sites AI engines trust (Reddit, G2, roundups)"
      - "Keep entity facts (name, founding year, category) consistent everywhere"
      - "Track which pages get cited in ChatGPT, Perplexity, and AI Overviews, then double down"
  - title: "9. Measurement & maintenance"
    items:
      - "Track rankings, organic clicks, and conversions by page intent, not just totals"
      - "Monitor Search Console for indexing, coverage, and manual-action issues"
      - "Watch AI-referral traffic in GA4 (ChatGPT, Perplexity, Gemini)"
      - "Run a full technical + content audit on a set cadence (quarterly is a good default)"
      - "Report on pipeline and revenue influence, not vanity traffic"

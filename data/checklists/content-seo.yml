title: "The Content SEO Checklist for 2026"
subtitle: "Everything to plan, write, and optimise a piece of content so it ranks and gets cited: research, structure, writing, on-page SEO, and refresh. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Research & intent"
    items:
      - "Pick one primary keyword plus related terms for the piece"
      - "Confirm the search intent from the live SERP before writing"
      - "Check you are not targeting the same intent as an existing page"
      - "Note the questions and subtopics the top results cover"
  - title: "2. Structure"
    items:
      - "Write a compelling title tag with the keyword near the front"
      - "Use one H1 and a logical H2/H3 outline that includes related terms"
      - "Answer the main query in the first paragraph"
      - "Add a table of contents on long pieces"
  - title: "3. Writing & E-E-A-T"
    items:
      - "Cover the topic more completely and usefully than the ranking pages"
      - "Add first-hand experience, original data, and examples AI can't fake"
      - "Attribute the piece to a named author with real credentials"
      - "Cite authoritative sources for claims and statistics"
  - title: "4. On-page SEO"
    items:
      - "Write a meta description that earns the click"
      - "Add internal links to and from relevant pages with descriptive anchors"
      - "Add descriptive image alt text and compress images"
      - "Add relevant structured data (Article, FAQ)"
      - "Front-load a quotable answer so AI engines can cite it"
  - title: "5. Optimise & refresh"
    items:
      - "Set a review date and refresh the piece before it decays"
      - "Prune or consolidate if it overlaps another page's intent"
      - "Track rankings, clicks, and conversions for the piece"

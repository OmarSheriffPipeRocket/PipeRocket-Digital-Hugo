title: "The SaaS Lead Generation Checklist for 2026"
subtitle: "A full-funnel lead gen system for B2B SaaS: targeting, on-site conversion, content-led and paid demand capture, and nurture that hands leads to sales cleanly. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF or Excel."
groups:
  - title: "1. Foundations & targeting"
    items:
      - "Define your ICP and the buying committee you need to reach"
      - "Set a clear cost-per-lead and pipeline target per channel"
      - "Agree lead definitions (MQL, SQL) with sales before spending"
      - "Set up tracking, UTMs, and CRM handoff so no lead is lost"
  - title: "2. On-site conversion"
    items:
      - "Put a clear primary CTA on every high-traffic page"
      - "Build dedicated landing pages per campaign, not just the homepage"
      - "Offer relevant lead magnets (templates, tools, reports) for each funnel stage"
      - "Reduce form friction: ask only for what sales actually needs"
      - "A/B test headlines, offers, and CTAs continuously"
  - title: "3. Organic & content-led"
    items:
      - "Target bottom-funnel, high-intent keywords that attract buyers, not browsers"
      - "Add contextual CTAs and lead magnets inside blog content"
      - "Use comparison and alternative pages to capture in-market demand"
  - title: "4. Paid & outbound"
    items:
      - "Run search ads on high-intent, bottom-funnel keywords"
      - "Retarget site visitors who did not convert"
      - "Align outbound sequences to the same ICP and messaging"
  - title: "5. Nurture & handoff"
    items:
      - "Set up email nurture for leads that are not ready to buy"
      - "Score leads and route hot ones to sales quickly"
      - "Close the loop: track which sources produce closed revenue, not just leads"

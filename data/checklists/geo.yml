title: "The GEO Checklist for 2026"
subtitle: "Generative Engine Optimization: get your brand cited by ChatGPT, Perplexity, Gemini, and Claude. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF."
groups:
  - title: "1. Let the AI crawlers in"
    items:
      - "Allow the AI crawlers you want to be cited by (GPTBot, PerplexityBot, ClaudeBot, Google-Extended)"
      - "Make sure content is server-rendered so non-JS AI crawlers can read it"
      - "Keep a clean, fast, crawlable site so retrieval systems can fetch pages"
  - title: "2. Be the most citable source"
    items:
      - "Publish original data, statistics, and research that models prefer to quote"
      - "State specific, verifiable facts with dates and named sources"
      - "Write clear definitions and direct claims models can lift confidently"
      - "Cover topics comprehensively so one page answers the whole question"
  - title: "3. Build entity & authority"
    items:
      - "Keep entity facts (name, founding year, HQ, category) identical everywhere"
      - "Earn mentions on the third-party sites LLMs trust (Reddit, G2, Wikipedia, roundups)"
      - "Get listed in best-of and comparison articles alongside category leaders"
      - "Maintain consistent, complete profiles across review sites and directories"
  - title: "4. Off-site presence"
    items:
      - "Build a genuine presence in the communities models train and retrieve from"
      - "Earn reviews and ratings that reinforce your positioning"
      - "Run digital PR so authoritative sources describe you the way you want to be cited"
  - title: "5. Measure AI visibility"
    items:
      - "Test your target prompts in ChatGPT, Perplexity, Gemini, and Claude monthly"
      - "Track whether you are mentioned, cited with a link, or ignored"
      - "Monitor AI-referral traffic in GA4 and double down on what gets cited"

title: "The SaaS SEO Strategy Checklist for 2026"
subtitle: "The strategic layer above the tactics: goals tied to pipeline, ICP-led keyword mapping, topical authority, product-led pages, and measurement. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF or Excel."
groups:
  - title: "1. Foundations & goals"
    items:
      - "Define the one or two SEO goals that map to pipeline (signups, demos, MQLs), not just traffic"
      - "Agree the north-star metric and how SEO reports into revenue"
      - "Audit current organic performance, indexed pages, and technical health as a baseline"
      - "Confirm the site is crawlable, fast, and server-rendered before scaling content"
  - title: "2. ICP & keyword strategy"
    items:
      - "Document your ideal customer profile and the jobs-to-be-done they search for"
      - "Map keywords to funnel stage (TOFU educational, MOFU comparison, BOFU high-intent)"
      - "Prioritise bottom-funnel and product-adjacent terms that convert before broad head terms"
      - "Group keywords into topic clusters with one pillar per cluster"
      - "Check for cannibalisation so one page owns each primary query"
  - title: "3. Content & topical authority"
    items:
      - "Build pillar-and-cluster hubs around your core categories"
      - "Cover the full buying journey: problem, solution, comparison, and product"
      - "Assign a clear primary keyword and search intent to every planned page"
      - "Set a realistic publishing and refresh cadence you can sustain"
  - title: "4. Product-led & bottom-funnel"
    items:
      - "Create comparison, alternative, and integration pages for your product"
      - "Add use-case and jobs-to-be-done pages tied to features"
      - "Build free tools or templates that earn links and rank for high-intent queries"
      - "Connect content to product signups with contextual CTAs"
  - title: "5. Authority & links"
    items:
      - "Earn links with original data, research, and expert-led content"
      - "Run digital PR and thought-leadership that gets your brand cited"
      - "Keep entity facts consistent so AI engines and Google trust the brand"
  - title: "6. Measurement & iteration"
    items:
      - "Track rankings, organic pipeline, and assisted conversions, not vanity traffic"
      - "Review and refresh decaying pages on a schedule"
      - "Double down on the clusters that produce pipeline and prune the ones that do not"

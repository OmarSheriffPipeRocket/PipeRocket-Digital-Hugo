title: "The YouTube SEO Checklist for 2026"
subtitle: "Everything to get a video found and watched: research, video optimisation, engagement signals, channel setup, accessibility and promotion. Tick items off as you go. Your progress saves automatically, and you can download the whole thing as a PDF or Excel."
groups:
  - title: "1. Research"
    items:
      - "Research topics people search on YouTube (use search suggest and the tools)"
      - "Check whether the query also shows videos in Google (double the reach)"
      - "Study the top-ranking videos for format, length, and angle"
      - "Pick one primary keyword plus related terms per video"
  - title: "2. Video optimisation"
    items:
      - "Put the primary keyword near the front of a compelling title"
      - "Write a detailed description with the keyword in the first two lines"
      - "Design a high-contrast, readable custom thumbnail"
      - "Add chapters (timestamps) for watch-time and key-moment eligibility"
      - "Add relevant tags and set the correct category"
  - title: "3. Engagement signals"
    items:
      - "Hook viewers in the first 15 seconds to protect retention"
      - "Optimise for click-through rate (thumbnail + title tested together)"
      - "Use end screens and cards to keep viewers on your content"
      - "Prompt comments, likes, and subscribes naturally"
  - title: "4. Accessibility & metadata"
    items:
      - "Upload an accurate caption/transcript (do not rely on auto-captions alone)"
      - "Add a pinned comment with key links and context"
      - "Use hashtags sparingly and relevantly"
  - title: "5. Channel & promotion"
    items:
      - "Optimise the channel: banner, about, keywords, and playlists"
      - "Group videos into keyword-themed playlists"
      - "Embed videos in relevant blog posts and share across channels"
  - title: "6. Measure"
    items:
      - "Track impressions, click-through rate, and average view duration"
      - "Find which videos drive subscribers and watch time, then make more"
      - "Refresh titles/thumbnails on underperforming videos with potential"

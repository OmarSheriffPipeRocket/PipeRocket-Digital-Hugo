<text x="730" y="70" fill="#282828" font-size="28" font-weight="700" text-anchor="middle">3.73%</text><rect x="670" y="88" width="120" height="12" fill="#fff" rx="3"/><rect x="670" y="88" width="114" height="12" fill="#0cc6f1" rx="3"/>

<g transform="translate(50 508)"><rect width="1100" height="52" fill="rgba(12,198,241,0.12)" rx="10"/><text x="22" y="22" fill="#0cc6f1" font-size="11" font-weight="700" letter-spacing="2">TAKE-AWAY</text><text x="22" y="41" fill="#282828" font-size="13" font-weight="600">Conversion rates are nearly identical, so a non-brand lead costs ~6x a brand lead ($207 vs $34) almost entirely on click price. Budget them apart.</text></g>

<text x="730" y="70" fill="#282828" font-size="28" font-weight="700" text-anchor="middle">3.94%</text><rect x="670" y="88" width="120" height="12" fill="#e8e4da" rx="3"/><rect x="670" y="88" width="120" height="12" fill="#c7c3b8" rx="3"/>
<text x="950" y="70" fill="#ff6b5c" font-size="28" font-weight="700" text-anchor="middle">$207</text><rect x="890" y="88" width="120" height="12" fill="#e8e4da" rx="3"/><rect x="890" y="88" width="120" height="12" fill="#ff6b5c" rx="3"/></g>
<g transform="translate(50 360)"><rect width="1100" height="130" fill="#e8e4da" stroke="#0cc6f1" stroke-width="1.5" rx="10"/><text x="22" y="52" fill="#0d0d0d" font-size="17" font-weight="700">Brand Search</text><text x="22" y="76" fill="#0cc6f1" font-size="10" font-weight="700" letter-spacing="1.5">THE EFFICIENT HALF</text><text x="22" y="98" fill="rgba(13,13,13,0.6)" font-size="11">Your own name / product</text>
<text x="290" y="70" fill="#0cc6f1" font-size="28" font-weight="700" text-anchor="middle">22.21%</text><rect x="230" y="88" width="120" height="12" fill="#fff" rx="3"/><rect x="230" y="88" width="120" height="12" fill="#0cc6f1" rx="3"/>
